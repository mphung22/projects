<!doctype html>
<html lang="vi" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <!-- The page is already Vietnamese + English; stop Chrome from machine-translating it. -->
  <meta name="google" content="notranslate">
  <meta name="theme-color" content="#f7f4ee">
  <title>Seren · Hoá đơn</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="bill.css?v=9">
</head>
<body>

  <header class="topbar">
    <a class="link-button" id="to-checkin" href="../">‹ Check-in</a>
    <div class="brand">S E R E N</div>
    <select id="bill-lang" aria-label="Ngôn ngữ / Language">
      <option value="both">VI + EN</option>
      <option value="vi">Tiếng Việt</option>
      <option value="en">English</option>
    </select>
  </header>

  <main id="bill-app" aria-live="polite"></main>

  <noscript><p class="card">Vui lòng bật JavaScript. / Please enable JavaScript.</p></noscript>
  <!-- app.js holds the menu and prices shared with the check-in forms; this flag stops it drawing the check-in screen. -->
  <script>window.SEREN_MENU_ONLY = true;</script>
  <script src="../config.js"></script>
  <script src="../app.js"></script>
  <script src="bill.js?v=9"></script>
</body>
</html>
